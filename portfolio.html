<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerita Kami - Jasa Bersih Lahan & Potong Pohon | Ponorogo, Madiun, Magetan</title>
  <meta name="description" content="Kisah sukses dan portofolio pengerjaan jasa pembersihan lahan kosong, potong rumput liar, babat suket, tebas semak, pembersihan lahan Madiun, potong pohon Magetan, pembukaan lahan Ngawi, jasa pangkas pohon Trenggalek.">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

  <!-- Header / Navbar Sederhana -->
  <header class="bg-white border-b border-slate-100 py-4 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
      <a href="index.html" class="font-bold text-xl text-emerald-800">BERES</a>
      <nav class="flex gap-6 text-sm font-semibold">
        <a href="index.html" class="text-slate-600 hover:text-emerald-600">Beranda</a>
        <a href="cerita.html" class="text-emerald-600">Cerita Kami</a>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="py-16 text-center max-w-3xl mx-auto px-6">
    <span class="text-xs font-bold tracking-widest text-emerald-600 uppercase bg-emerald-50 px-3 py-1 rounded-full">Portofolio & Kisah Sukses</span>
    <h1 class="text-4xl font-extrabold text-slate-900 mt-3 mb-4">Cerita Kami</h1>
    <p class="text-slate-600 text-base">Dokumentasi nyata perjalanan tim BERES dalam menyulap lahan terbengkalai menjadi area bersih, rapi, dan siap pakai di seluruh wilayah Jawa Timur.</p>
  </section>

  <!-- Grid Konten Artikel CMS -->
  <main class="max-w-7xl mx-auto px-6 pb-24">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <!-- Artikel Dinamis dari CMS akan muncul otomatis di sini -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-12 text-center text-sm">
    <p>&copy; 2026 BERES - JASA BERSIH LAHAN. ALL RIGHTS RESERVED.</p>
  </footer>

  <!-- Script Pembaca Markdown CMS (Tanpa Error Toolbar) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
  async function loadCMSStories() {
    const container = document.querySelector('.grid');
    if (!container) return;

    try {
      const response = await fetch('https://api.github.com/repos/masada679/web-jasaberesbaru/contents/content/cerita');
      if (!response.ok) return;
      const files = await response.json();

      for (const file of files) {
        if (file.name.endsWith('.md')) {
          const res = await fetch(file.download_url);
          const text = await res.text();

          const parts = text.split('---');
          if (parts.length < 3) continue;

          const metadataStr = parts[1];
          const bodyStr = parts.slice(2).join('---');

          const getMeta = (key) => {
            const match = metadataStr.match(new RegExp(`${key}:\\s*"(.*?)"|${key}:\\s*(.*)`));
            return match ? (match[1] || match[2] || '').trim() : '';
          };

          const title = getMeta('title') || 'Proyek Pembersihan';
          const location = getMeta('location') || 'Jawa Timur';
          let imgBefore = getMeta('img_before') || getMeta('foto_sebelum') || 'assets/img/default.jpg';
          
          if (imgBefore.startsWith('/')) imgBefore = imgBefore.substring(1);

          const cardHTML = `
            <article class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition duration-300 border border-slate-100 flex flex-col justify-between">
              <div>
                <div class="h-48 overflow-hidden relative bg-slate-200">
                  <img src="/${imgBefore}" alt="${title}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400?text=Jasa+Beres'">
                  <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full shadow-sm">
                    ${location}
                  </span>
                </div>
                <div class="p-5">
                  <h2 class="font-bold text-slate-800 text-lg mb-2 leading-snug">${title}</h2>
                  <div class="text-slate-600 text-sm line-clamp-3 mb-4">${marked.parse(bodyStr)}</div>
                </div>
              </div>
              <div class="px-5 pb-5">
                <a href="#" class="text-emerald-600 font-semibold text-sm flex items-center gap-1 hover:gap-2 transition-all">
                  Baca Selengkapnya &rarr;
                </a>
              </div>
            </article>
          `;

          container.insertAdjacentHTML('afterbegin', cardHTML);
        }
      }
    } catch (err) {
      console.error("Gagal memuat cerita CMS:", err);
    }
  }

  document.addEventListener("DOMContentLoaded", loadCMSStories);
  </script>
</body>
</html>
